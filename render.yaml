services:
  - type: web
    name: educacao-aulao-linguagens
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TEACHER_PASSWORD
        sync: false
      - key: PGSSL
        value: "false"
